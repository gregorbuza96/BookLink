name: BookLink CI/CD — k3s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
  # Images target the t4g (ARM/Graviton) node.
  PLATFORM: linux/arm64

jobs:
  # ── Build & Test ────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run monolith tests
        run: |
          cd booklink-backend
          ./mvnw test -Dspring.profiles.active=test

      - name: Build microservices JARs
        run: mvn -B package -DskipTests

  # ── Build & push images to ECR ──────────────────────────
  # NOTE: infrastructure (the k3s EC2 box) is created separately and
  # manually with `terraform apply` — it is intentionally NOT part of
  # this pipeline. This job only ships application images.
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all JARs
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # arm64 images are built via QEMU emulation. The Dockerfiles only
      # COPY a prebuilt JAR onto a multi-arch base image (no compilation
      # under emulation), so this stays fast.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push images (arm64)
        run: |
          TAG=${{ github.sha }}
          build_push() {
            local name="$1" ctx="$2"
            aws ecr describe-repositories --repository-names "booklink/$name" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "booklink/$name" >/dev/null
            docker buildx build --platform "$PLATFORM" \
              -t "$ECR_REGISTRY/booklink/$name:$TAG" \
              -t "$ECR_REGISTRY/booklink/$name:latest" \
              --push "$ctx"
          }
          for s in config-server api-gateway user-service hotel-service booking-service; do
            build_push "$s" "./$s"
          done
          build_push frontend ./booklink-frontend

  # ── Trigger the k3s node to pull the new images ─────────
  # Optional: runs only if the K3S_HOST / K3S_SSH_KEY secrets are set.
  # Deployments use the :latest tag (imagePullPolicy Always), so a
  # rollout restart makes the node re-pull and roll out the new images.
  deploy:
    name: Roll out on k3s
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Rollout restart over SSH
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          if [ -z "$K3S_HOST" ] || [ -z "$K3S_SSH_KEY" ]; then
            echo "K3S_HOST / K3S_SSH_KEY not set — skipping rollout."
            echo "Set them as repo secrets to auto-deploy, or restart manually:"
            echo "  ssh ec2-user@<elastic-ip> sudo k3s kubectl -n booklink rollout restart deployment"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$K3S_SSH_KEY" > ~/.ssh/id_k3s
          chmod 600 ~/.ssh/id_k3s
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_k3s "ec2-user@$K3S_HOST" \
            "sudo k3s kubectl -n booklink rollout restart deployment"
