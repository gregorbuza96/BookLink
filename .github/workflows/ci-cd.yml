name: BookLink CI/CD — k3s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
  PLATFORM: linux/arm64

jobs:
  # ── Build & Test ────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run monolith tests
        run: |
          cd booklink-backend
          ./mvnw test -Dspring.profiles.active=test

      - name: Build microservices JARs
        run: mvn -B package -DskipTests

  # ── Build & push images to ECR ──────────────────────────
  # Runs on a NATIVE arm64 runner (the t4g node's arch) so the frontend's
  # `npm ci`/`ng build` run natively — QEMU emulation crashes on it.
  # arm64 GitHub-hosted runners are free for public repos.
  # NOTE: infrastructure (the k3s EC2 box) is created separately and
  # manually with `terraform apply` — intentionally NOT in this pipeline.
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-24.04-arm
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all JARs
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push images (arm64, native)
        run: |
          TAG=${{ github.sha }}
          build_push() {
            local name="$1" ctx="$2"
            aws ecr describe-repositories --repository-names "booklink/$name" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "booklink/$name" >/dev/null
            docker buildx build --platform "$PLATFORM" \
              -t "$ECR_REGISTRY/booklink/$name:$TAG" \
              -t "$ECR_REGISTRY/booklink/$name:latest" \
              --push "$ctx"
          }
          for s in config-server api-gateway user-service hotel-service booking-service; do
            build_push "$s" "./$s"
          done
          build_push frontend ./booklink-frontend

  # ── Trigger the k3s node to pull the new images ─────────
  # Uses AWS Systems Manager (no inbound SSH). Deployments use the :latest
  # tag (imagePullPolicy Always), so a rollout restart re-pulls and rolls
  # out the new images.
  deploy:
    name: Roll out on k3s
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollout restart via SSM
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=booklink-dev-k3s" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$IID" ] || [ "$IID" = "None" ]; then
            echo "No running k3s node found — skipping rollout."; exit 0
          fi
          echo "Target instance: $IID"
          CMD=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name "AWS-RunShellScript" \
            --comment "BookLink rollout ${{ github.sha }}" \
            --parameters 'commands=["k3s kubectl -n booklink rollout restart deployment","k3s kubectl -n booklink rollout status deployment/api-gateway --timeout=180s"]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$IID" || true
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
            --query "{Status:Status,Output:StandardOutputContent,Err:StandardErrorContent}" --output json
