# Apply AFTER cert-manager is installed:
#   kubectl apply -f terraform/clusterissuer.yaml
# Replace the email with a real one (or set acme_email in tfvars and edit here).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com # PLACEHOLDER
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
